name: LemonMint CI - ver/1.21.8

on:
  push:
    branches: [ "ver/1.21.8" ]
  pull_request:
    branches: [ "ver/1.21.8" ]
    paths:
      - '.github/workflows/build_1.21.8.yaml'

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    environment: default

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up JDK
        uses: actions/setup-java@v4.5.0
        with:
          java-version: '22'
          distribution: 'zulu'
          architecture: x64

      - name: Config Git
        run: |
          git config --global user.email "CI@menthamc.com" && git config --global user.name "MenthaMC-CI"

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Apply Patches
        run: |
          ./gradlew applyAllPatches

      - name: CreateJar
        run: |
          ./gradlew createMojmapPaperclipJar

      - name: Push to API
        continue-on-error: true
        run: |
          ./gradlew publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.commit_tag }}
          name: 'LemonMint 1.21.8'
          files: 'lemonMint-server/build/libs/*-paperclip.jar'
