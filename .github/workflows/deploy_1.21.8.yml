name: LemonMint CI - ver/1.21.8

on:
  push:
    paths:
      - "lemonmint-server/**/*"
      - "lemonmint-api/**/*"
      - "lemonmint-script/**/*"
      - ".github/workflows/deploy_1.21.8.yml"
      - "scripts/*.sh"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

jobs:
  build:
    runs-on: ubuntu-latest
    environment: default

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up JDK
        uses: actions/setup-java@v4.5.0
        with:
          java-version: '22'
          distribution: 'zulu'
          architecture: x64

      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: Grant execute permission for build scripts.
        run: |
          chmod +x gradlew
          chmod +x scripts/set_env.sh

      - name: Apply Server Patches
        run: |
          ./gradlew applyAllPatches

      - name: Create Server Jar
        run: |
          ./gradlew createMojmapPaperclipJar

      - name: Publish Server API
        continue-on-error: true
        run: |
          ./gradlew generateDevelopmentBundle publish -PpublishDevBundle=true
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name : Configure environment
        run: |
          sh scripts/set_env.sh

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.mcversion }}-${{ env.commit_tag }}
          name: LemonMint ${{ env.version }} - ${{ env.commit_tag }}
          body: |
            ### 📦Version: `${{ env.version }}` | Commit ${{ env.commit_tag }}
            ![download](https://img.shields.io/github/downloads/MenthaMC/LemonMint/${{ env.commit_tag }}/total?style=for-the-badge&logo=github&label=Downloads&logoColor=white&color=c4a400)
            This release is automatically compiled by GitHub Actions
            ### 📜 Commit Message:
            ${{ env.commit_msg }}
          artifacts: |
            target/**
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
